<title>Ruta Pulppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=Nunito+Sans:wght@300;400;700&display=swap">
<style>
:root{
  --black:#212322; --white:#FFFFFF; --yellow:#F6BE00; --gray:#B7B7B7; --light:#F3F3F3; --red:#A52003; --green:#529999;
  --bg:#FFFFFF; --card:#F3F3F3; --text:#212322; --muted:rgba(33,35,34,.68); --line:#B7B7B7; --line-soft:rgba(33,35,34,.12);
  --btn-bg:#212322; --btn-text:#FFFFFF; --accent:#F6BE00; --ok:#529999; --err:#A52003;
  --ok-soft:rgba(82,153,153,.14); --err-soft:rgba(165,32,3,.10); --accent-soft:rgba(246,190,0,.16);
  --overlay:rgba(33,35,34,.7); --logo-filter:none;
  --display:'Heldane Text','EB Garamond',Georgia,serif;
  --body:'Nunito Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#212322; --card:rgba(255,255,255,.06); --text:#FFFFFF; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.28); --line-soft:rgba(255,255,255,.12);
    --btn-bg:#FFFFFF; --btn-text:#212322; --ok-soft:rgba(82,153,153,.22); --err-soft:rgba(165,32,3,.28); --accent-soft:rgba(246,190,0,.14);
    --overlay:rgba(33,35,34,.85); --logo-filter:invert(1); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#212322; --card:rgba(255,255,255,.06); --text:#FFFFFF; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.28); --line-soft:rgba(255,255,255,.12);
  --btn-bg:#FFFFFF; --btn-text:#212322; --ok-soft:rgba(82,153,153,.22); --err-soft:rgba(165,32,3,.28); --accent-soft:rgba(246,190,0,.14);
  --overlay:rgba(33,35,34,.85); --logo-filter:invert(1); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--text);font:400 16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:37px} h2{font-size:27px} h3{font-size:20px}
p{margin:0}
.tag{font:700 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.cap{font-weight:300;font-size:13px;color:var(--muted)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.accent-line{width:48px;height:2px;background:var(--accent)}

/* Header */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px}
.brand{display:flex;flex-direction:column;gap:6px}
.logo{width:40px;height:40px;filter:var(--logo-filter);flex:none}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.hud .stat{padding:12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.hud .n{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
.bar.ok > i{background:var(--ok)}

/* Tabs */
nav.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line-soft);margin-bottom:24px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:14px 12px 12px;white-space:nowrap;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .dot{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#212322;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;letter-spacing:0}
.view{display:flex;flex-direction:column;gap:24px}
.section-head{display:flex;flex-direction:column;gap:8px;max-width:62ch}

/* Path */
.units{display:flex;flex-direction:column;gap:0}
.track-title{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.track-title .line{flex:1;height:1px;background:var(--line-soft)}
.unit{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;padding:10px 0;position:relative}
.unit .node{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;position:relative;z-index:1}
.unit .node svg{width:26px;height:26px}
.unit:not(:last-child)::before{content:"";position:absolute;left:32px;top:50%;height:100%;width:2px;background:var(--line-soft)}
.unit.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.unit.current .node{border:4px solid var(--accent);background:var(--accent-soft)}
.unit.locked .node{opacity:.5}
.unit .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.unit .meta .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.unit button.go{justify-self:start}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--card);letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--text)}
.pill.warn{background:var(--accent-soft)}
.pill.err{background:var(--err-soft)}

.btn{border:0;border-radius:4px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.yellow{background:var(--accent);color:#212322}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:14px}

/* Cards / lists */
.card{background:var(--card);border-radius:4px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.checklist{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.check{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.check input{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:4px;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--bg)}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{display:flex;flex-direction:column;gap:3px}
.check .t b{font-weight:700}
.check.is-done .t b{text-decoration:line-through;text-decoration-color:var(--muted)}
.xp{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Guide */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-soft)}
.step .num{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.step.is-done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.next .num{border-color:var(--accent);border-width:3px}
.step .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.step .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.where{font-size:13px;font-weight:700;background:var(--card);padding:6px 10px;border-radius:3px;align-self:flex-start}

/* News */
.news{display:flex;flex-direction:column}
.newsitem{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line-soft)}
.newsitem .rank{font-family:var(--display);font-size:37px;line-height:1;color:var(--muted)}
.newsitem .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.why{border-left:2px solid var(--accent);padding-left:12px}
.explain-out{white-space:pre-wrap;background:var(--card);padding:14px;border-radius:4px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{padding:10px 14px;border-radius:4px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.me{align-self:flex-end;background:var(--btn-bg);color:var(--btn-text)}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line-soft)}
.composer{display:flex;gap:8px}
.composer input,.field input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:4px;padding:11px 12px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:16px;padding:6px 12px;font-size:13px}

/* Team */
.table-wrap{overflow-x:auto;border-top:1px solid var(--line-soft)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{font:700 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
.who{display:flex;gap:10px;align-items:center}
.who img{width:28px;height:28px;border-radius:50%}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .bar{width:70px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.statrow .s{padding:16px 16px 16px 0;display:flex;flex-direction:column;gap:4px}
.statrow .s + .s{padding-left:16px;border-left:1px solid var(--line-soft)}
.statrow .n{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rank-list{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.rank-row.me{background:var(--accent-soft);padding-inline:8px;margin-inline:-8px}
.rank-row .pos{font-family:var(--display);font-size:20px;color:var(--muted)}

/* Lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson .lhead{display:flex;align-items:center;gap:16px;padding:16px 20px;max-width:760px;width:100%;margin:0 auto}
.lesson .lhead .bar{flex:1;height:10px;border-radius:5px}
.iconbtn{background:none;border:0;padding:6px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.lesson .lbody{flex:1;overflow-y:auto;padding:12px 20px 24px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.lesson .lfoot{border-top:1px solid var(--line-soft);padding:16px 20px}
.lesson .lfoot .in{max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lesson .lfoot.ok{background:var(--ok-soft);border-top-color:var(--ok)}
.lesson .lfoot.err{background:var(--err-soft);border-top-color:var(--err)}
.fb{display:flex;flex-direction:column;gap:4px;flex:1 1 280px;min-width:0}
.fb b{font-size:17px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line-soft);border-radius:6px;padding:14px 16px;font-size:16px;display:flex;gap:12px;align-items:center}
.opt .k{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt.sel{border-color:var(--text)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt:disabled{cursor:default}
.concept{display:flex;flex-direction:column;gap:14px}
.concept ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.result{display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding-top:24px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-text);padding:10px 16px;border-radius:4px;font-weight:700;font-size:14px;z-index:80}
.empty{padding:24px;background:var(--card);border-radius:4px}
.sync{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;padding:3px;gap:3px;width:100%;max-width:460px}
.seg button{border:0;background:none;padding:9px 8px;border-radius:4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-text)}
.actions3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.acard{background:var(--card);border:2px solid transparent;border-radius:4px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--text)}
.acard:hover:not(:disabled){border-color:var(--line)}
.acard:disabled{opacity:.55;cursor:default}
.acard .ic svg{width:26px;height:26px}
.simlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px;margin-top:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.badge .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);flex:none}
.badge.on{color:var(--text)}
.badge.on .b{border:2px solid var(--accent);background:var(--accent);color:#212322}
.badge .b svg{width:24px;height:24px}
.badge.big{flex-direction:row;gap:14px;font-size:16px;text-align:left}
.types{display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-size:11px;padding:2px 8px;border:1px solid var(--line-soft);border-radius:10px;color:var(--muted)}
.hearts{display:flex;gap:3px;color:var(--err)} .hearts svg{width:22px;height:22px} .hearts .off{color:var(--line-soft)}
.combo{font-weight:700;font-size:13px;background:var(--accent);color:#212322;padding:3px 9px;border-radius:10px;white-space:nowrap}
.ord-answer{display:flex;flex-direction:column;gap:8px;min-height:64px;border:2px dashed var(--line-soft);border-radius:6px;padding:10px}
.ord-row{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line-soft);border-radius:6px;padding:10px 12px;font-size:15px}
.ord-row .k{width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ord-row.right{border-color:var(--ok);background:var(--ok-soft)} .ord-row.wrong{border-color:var(--err);background:var(--err-soft)}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.tok,.mt{background:var(--bg);border:2px solid var(--line-soft);border-radius:6px;padding:10px 12px;font-size:15px;text-align:left;color:var(--text)}
.tok:hover,.mt:hover:not(:disabled){border-color:var(--line)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{min-height:54px}
.mt.sel{border-color:var(--text);background:var(--card)}
.mt.done{border-color:var(--ok);background:var(--ok-soft);opacity:.65;cursor:default}
.mt.bad{border-color:var(--err);background:var(--err-soft)}
.calc{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:6px;padding:2px 14px;max-width:380px}
.calc .u{font-family:var(--display);font-size:24px;color:var(--muted)}
.calc input{border:0;background:none;font:400 30px/1.2 var(--display);color:var(--text);width:100%;min-width:0;padding:8px 0;outline:none}
.calc.right{border-color:var(--ok);background:var(--ok-soft)} .calc.wrong{border-color:var(--err);background:var(--err-soft)}
.msgs.sim{max-height:none;overflow:visible}
ul.plain{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}} .pop{animation:pop .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}} .shake{animation:shake .3s}
@media (max-width:560px){
  .match .mt{font-size:14px;padding:9px}
  .hud{grid-template-columns:repeat(2,1fr)}
  h1{font-size:30px}
  .hud .n{font-size:26px}
  .unit{grid-template-columns:60px 1fr}
  .unit .node{width:54px;height:54px}
  .unit:not(:last-child)::before{left:27px}
  .newsitem{grid-template-columns:1fr}
  .newsitem .rank{font-size:27px}
  .statrow .n{font-size:32px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="tag">Pulppo · Onboarding de asesores</span>
      <h1>Ruta Pulppo</h1>
      <p class="muted" id="greet">Aprende la plataforma y el oficio en lecciones de 3 minutos.</p>
    </div>
    <img class="logo" alt="Pulppo" src="data:image/png;base64,__LOGO__">
  </header>

  <section class="hud" aria-label="Tu progreso">
    <div class="stat"><span class="tag">Racha</span><span class="n" id="hStreak">0</span><span class="cap" id="hStreakCap">días seguidos</span></div>
    <div class="stat"><span class="tag">XP total</span><span class="n" id="hXp">0</span><span class="cap" id="hLevel">Nivel 1</span></div>
    <div class="stat"><span class="tag">Meta de hoy</span><span class="n" id="hGoal">0/30</span><div class="bar" style="margin-top:6px"><i id="hGoalBar"></i></div></div>
    <div class="stat"><span class="tag">Ruta</span><span class="n" id="hPath">0%</span><span class="cap">lecciones, guía y tareas</span></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="tab-learn" aria-selected="true" data-view="learn">Aprender</button>
    <button role="tab" id="tab-guide" aria-selected="false" data-view="guide">Primeros pasos <span class="dot" id="dGuide" hidden></span></button>
    <button role="tab" id="tab-tasks" aria-selected="false" data-view="tasks">Tareas <span class="dot" id="dTasks" hidden></span></button>
    <button role="tab" id="tab-news" aria-selected="false" data-view="news">Noticias</button>
    <button role="tab" id="tab-team" aria-selected="false" data-view="team">Ranking</button>
  </nav>

  <main>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-guide" hidden></section>
    <section class="view" id="view-tasks" hidden></section>
    <section class="view" id="view-news" hidden></section>
    <section class="view" id="view-team" hidden></section>
  </main>
  <p class="sync" id="sync" style="margin-top:32px">Guardando en este navegador.</p>
</div>

<div class="lesson" id="lesson" hidden role="dialog" aria-modal="true" aria-label="Lección"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================== CONTENIDO =========================== */
const ICONS = {
  info:'<path d="M12 8v.01M11 12h1v5h1"/><circle cx="12" cy="12" r="9"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  home:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
  tag:'<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

function isoWeek(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-W'+pad(Math.ceil(((t-y)/864e5+1)/7)); }

async function flush(){

}

function addXp(n){

/* ---- Motor de lecciones ---- */
let L=null, SIM=null;
function qByKey(key){ const [uid,k]=key.split(':'); const u=[...UNITS,...ACADEMY].find(x=>x.id===uid); return u ? u.qs[+k] : null; }
function startUnit(listKey,i){
  const list = listKey==='academia' ? ACADEMY : UNITS; const u=list[i];
  openLesson({mode:'unit', listKey, u, idx:i, intro:u.concept, title:u.title, eyebrow:`${listKey==='academia'?'Academia del Broker':'Plataforma Pulppo'} · Unidad ${i+1}`, items:u.qs.map((q,k)=>({key:u.id+':'+k,q})), hearts: listKey==='academia'?3:null});
}
function startDaily(){
  const pool=[]; ACADEMY.forEach(u=>u.qs.forEach((q,k)=>pool.push({key:u.id+':'+k,q})));
  const pick=[]; const seen=new Set();
  for(const it of shuffle(pool)){ const t=qType(it.q); if(pick.length<3 && !seen.has(t)){ pick.push(it); seen.add(t);} }
  openLesson({mode:'daily', title:'Reto del día', items:pick, hearts:3});
}
function startReview(){
  const items=S.mistakes.map(k=>({key:k,q:qByKey(k)})).filter(x=>x.q).slice(-8);
  if(!items.length) return;
  openLesson({mode:'review', title:'Repaso de errores', items, hearts:null});
}
function openLesson(cfg){
  L=Object.assign({cfg, queue:cfg.items.map((_,k)=>k), pos:cfg.intro?-1:0, firstTry:{}, retried:{}, done:0, xp:0, combo:0, maxCombo:0}, cfg);
  if(L.pos===0) prepQ();
  $('lesson').hidden=false; document.body.style.overflow='hidden';
  renderLesson();
}
function closeLesson(){ $('lesson').hidden=true; document.body.style.overflow=''; L=null; SIM=null; if(simCtl) simCtl.abort(); renderAll(); }
function curItem(){ return L.items[L.queue[L.pos]]; }
function prepQ(){
  const q=curItem().q; L.sel=null; L.answered=false; L.ok=false; L.fx='';
  if(qType(q)==='order'){ const idx=q.items.map((_,k)=>k); let p=shuffle(idx); if(p.every((v,k)=>v===k)) p.reverse(); L.ord={pool:p, picked:[]}; }
  if(qType(q)==='match'){ const idx=q.pairs.map((_,k)=>k); L.mt={left:shuffle(idx), right:shuffle(idx), selL:null, done:[], bad:null, mistakes:0}; }
  if(qType(q)==='calc'){ L.calcVal=''; }
}
function heartsHtml(){ if(L.hearts==null) return ''; let h=''; for(let i=0;i<3;i++) h+=`<span class="${i<L.hearts?'':'off'}">${ico('heart',1.8)}</span>`; return `<span class="hearts" aria-label="${L.hearts} vidas">${h}</span>`; }
function qBody(q){
  const t=qType(q);
  const label = {mc:'Pregunta',sc:'¿Qué harías?',order:'Ordena',match:'Empareja',calc:'Calcula'}[t];
  let h = `<span class="tag">${L.retried[L.queue[L.pos]]&&L.pos>=L.items.length?'Segundo intento · ':''}${label}</span><h2>${esc(q.q)}</h2>`;
  if(t==='mc'||t==='sc'){
    h += `<div class="opts" role="radiogroup">${q.o.map((o,k)=>{ let cls=''; if(L.answered){ if(k===q.a) cls='right'; else if(k===L.sel) cls='wrong'; } else if(k===L.sel) cls='sel';
      return `<button class="opt ${cls}" role="radio" aria-checked="${k===L.sel}" data-k="${k}" ${L.answered?'disabled':''}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`; }).join('')}</div>`;
  } else if(t==='order'){
    const {pool,picked}=L.ord;
    h += `<div class="ord-answer">${picked.length? picked.map((k,pos)=>{ const cls = L.answered ? (k===pos?'right':'wrong') : ''; return `<button class="ord-row ${cls}" data-rm="${k}" ${L.answered?'disabled':''}><span class="k">${pos+1}</span><span>${esc(q.items[k])}</span></button>`; }).join('') : '<span class="cap">Toca los elementos de abajo en el orden correcto.</span>'}</div>
    <div class="ord-pool">${pool.filter(k=>!picked.includes(k)).map(k=>`<button class="tok" data-add="${k}">${esc(q.items[k])}</button>`).join('')}</div>`;
  } else if(t==='match'){
    const m=L.mt;
    const cell=(side,k,txt)=>{ const done=m.done.includes(k); const sel= side==='l' && m.selL===k; const bad = m.bad && ((side==='l'&&m.bad[0]===k)||(side==='r'&&m.bad[1]===k));
      return `<button class="mt ${done?'done':''} ${sel?'sel':''} ${bad?'bad shake':''}" data-${side}="${k}" ${done||L.answered?'disabled':''}>${esc(txt)}</button>`; };
    h += `<div class="match"><div class="col">${m.left.map(k=>cell('l',k,q.pairs[k][0])).join('')}</div><div class="col">${m.right.map(k=>cell('r',k,q.pairs[k][1])).join('')}</div></div><span class="cap">Toca un concepto y luego su pareja. ${m.mistakes?`Errores: ${m.mistakes}`:''}</span>`;
  } else if(t==='calc'){
    const cls = L.answered ? (L.ok?'right':'wrong') : '';
    h += `<label class="calc ${cls}" for="calcIn">${q.pre?`<span class="u">${esc(q.pre)}</span>`:''}<input id="calcIn" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(L.calcVal)}" ${L.answered?'disabled':''} aria-label="Tu respuesta">${q.post?`<span class="u">${esc(q.post)}</span>`:''}</label><span class="cap">Escribe solo el número. Puedes usar comas y punto decimal.</span>`;
  }
  return h;
}
function canCheck(){
  const q=curItem().q, t=qType(q);
  if(t==='mc'||t==='sc') return L.sel!==null;
  if(t==='order') return L.ord.picked.length===q.items.length;
  if(t==='calc') return L.calcVal.trim()!=='' && !isNaN(parseNum(L.calcVal));
  return false;
}
const parseNum = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));
function feedback(q){
  const t=qType(q);
  if(L.ok){
    const head = L.combo>=3 ? `Correcto · combo x${L.combo}` : 'Correcto';
    return {head, text: t==='sc' ? q.fb[q.a] : q.e};
  }
  if(t==='mc') return {head:'La respuesta es: '+q.o[q.a], text:q.e};
  if(t==='sc') return {head:'Mejor opción: '+q.o[q.a], text:q.fb[L.sel]};
  if(t==='order') return {head:'Orden correcto: '+q.items.join(' → '), text:q.e};
  if(t==='calc') return {head:'Respuesta: '+(q.pre||'')+fmtN(q.a)+(q.post||''), text:q.e};
  if(t==='match') return {head:`Completado con ${L.mt.mistakes} error${L.mt.mistakes===1?'':'es'}`, text:q.e};
}
function renderLesson(){
  if(SIM) return renderSim();
  const el=$('lesson');
  const pct = L.pos<0 ? 0 : Math.min(100, L.done/L.items.length*100);
  let body='', foot='', footClass='';
  if(L.failed){

    foot = `<span class="cap">${L.items.length} ejercicios · ~3 min</span><button class="btn" id="lNext">Empezar</button>`;
  } else if(L.finished){

    body = `<div class="result pop"><span class="tag">${esc(L.title)} · completado</span><h1>${L.firstCorrect===total?'Perfecto.':'Bien hecho.'}</h1>
      <div class="statrow" style="width:100%"><div class="s"><span class="n">+${L.xp}</span><span class="cap">XP ganados</span></div><div class="s"><span class="n">${L.firstCorrect}/${total}</span><span class="cap">al primer intento</span></div><div class="s"><span class="n">x${L.maxCombo}</span><span class="cap">mejor combo</span></div>${L.hearts!=null?`<div class="s"><span class="n">${L.hearts}</span><span class="cap">vidas restantes</span></div>`:''}</div>
      ${L.newBadge?`<div class="badge on big"><span class="b">${ico(L.u.icon)}</span><span><b>Insignia desbloqueada:</b> ${esc(L.u.badge)}</span></div>`:''}
      ${L.dailyBonus?'<p><b>+15 XP</b> por completar el reto del día.</p>':''}</div>`;
    foot = `<span></span><button class="btn" id="lDone">Continuar</button>`;
  } else {
    const q=curItem().q;
    body = qBody(q);
    if(!L.answered){
      const t=qType(q);
      foot = t==='match' ? `<span class="cap">Se revisa al unir todas las parejas.</span><span></span>` : `<span class="cap">${t==='mc'||t==='sc'?`Teclas 1–${q.o.length}`:t==='order'?'Toca un paso elegido para quitarlo':'Enter para comprobar'}</span><button class="btn" id="lCheck" ${canCheck()?'':'disabled'}>Comprobar</button>`;
    } else {
      const f=feedback(q); footClass = L.ok?'ok':'err';
      foot = `<div class="fb"><b>${esc(f.head)}</b><span>${esc(f.text)}</span></div><button class="btn" id="lNext">Continuar</button>`;
    }
  }

  $('lClose').onclick=closeLesson;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ L.sel=+b.dataset.k; renderLesson(); });
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ L.ord.picked.push(+b.dataset.add); renderLesson(); });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ L.ord.picked=L.ord.picked.filter(k=>k!==+b.dataset.rm); renderLesson(); });
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ L.mt.selL=+b.dataset.l; L.mt.bad=null; renderLesson(); });
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>matchPick(+b.dataset.r));
  const ci=$('calcIn'); if(ci){ ci.oninput=()=>{ L.calcVal=ci.value; const c=$('lCheck'); if(c) c.disabled=!canCheck(); }; if(!L.answered) ci.focus({preventScroll:true}); }
  if($('lCheck')) $('lCheck').onclick=check;
  if($('lNext')) $('lNext').onclick=next;
  if($('lDone')) $('lDone').onclick=closeLesson;
  if($('lRetry')) $('lRetry').onclick=()=>openLesson(L.cfg);
  if(!ci){ const f=el.querySelector('#lNext,#lDone,#lCheck:not([disabled])'); if(f) f.focus({preventScroll:true}); }
}
function matchPick(r){
  const m=L.mt; if(m.selL===null) return;
  if(m.selL===r){ m.done.push(r); m.selL=null; m.bad=null;
    if(m.done.length===curItem().q.pairs.length){ grade(m.mistakes===0); return; } }
  else { m.mistakes++; m.bad=[m.selL,r]; m.selL=null; setTimeout(()=>{ if(L&&L.mt===m){ m.bad=null; renderLesson(); } },600); }
  renderLesson();
}
function check(){
  if(!canCheck()) return;
  const q=curItem().q, t=qType(q);
  if(t==='mc'||t==='sc') grade(L.sel===q.a);
  else if(t==='order') grade(L.ord.picked.every((v,k)=>v===k));
  else if(t==='calc') grade(Math.abs(parseNum(L.calcVal)-q.a) <= (q.tol ?? 0.5));
}
function grade(ok){
  const qi=L.queue[L.pos], it=L.items[qi];
  L.answered=true; L.ok=ok;
  const first = !(qi in L.firstTry);
  if(first) L.firstTry[qi]=ok;
  if(ok){
    if(first){ L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.xp += 10 + (L.combo>=3?2:0); }
    L.done++;
    if(L.mode==='review') S.mistakes=S.mistakes.filter(k=>k!==it.key);
  } else {
    L.combo=0;
    if(L.mode!=='review' && !S.mistakes.includes(it.key)){ S.mistakes.push(it.key); if(S.mistakes.length>40) S.mistakes.shift(); }
    if(L.hearts!=null) L.hearts=Math.max(0,L.hearts-1);
    if(!L.retried[qi]){ L.retried[qi]=true; L.queue.push(qi); } else L.done++;
  }
  renderLesson();
}
function next(){
  if(L.pos<0){ L.pos=0; prepQ(); renderLesson(); return; }
  if(L.hearts===0){ L.failed=true; persist(); renderLesson(); return; }
  L.pos++;
  if(L.pos>=L.queue.length) finishLesson(); else prepQ();
  renderLesson();
}
function finishLesson(){
  L.finished=true;
  L.firstCorrect = Object.values(L.firstTry).filter(Boolean).length;
  let gain=L.xp;
  if(L.firstCorrect===L.items.length && L.mode==='unit') gain+=5;
  if(L.mode==='unit'){
    const store = L.listKey==='academia' ? S.academy : S.lessons;
    const prev = store[L.u.id];
    if(prev) gain=Math.ceil(gain/2);
    store[L.u.id] = {best:Math.max(prev?.best||0, L.firstCorrect), at:Date.now(), tries:(prev?.tries||0)+1};
    L.newBadge = L.listKey==='academia' && !prev;
  }
  if(L.mode==='daily' && S.dailyDone!==today()){ gain+=15; S.dailyDone=today(); L.dailyBonus=true; }
  L.xp=gain; addXp(gain); persist(); celebrate();
}
document.addEventListener('keydown',e=>{
  if($('lesson').hidden || SIM || !L) return;
  if(e.key==='Escape'){ closeLesson(); return; }
  if(L.pos<0 || L.failed || L.finished) return;
  const q=curItem().q, t=qType(q);
  if(!L.answered && (t==='mc'||t==='sc')){ const n=parseInt(e.key,10); if(n>=1&&n<=q.o.length){ L.sel=n-1; renderLesson(); return; } }
  if(e.key==='Enter'){
    if(e.target && e.target.tagName==='BUTTON' && e.target.id!=='calcIn') return;
    e.preventDefault(); if(L.answered) next(); else check();
  }
});

/* ---- Celebración ---- */
function celebrate(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cols=['#F6BE00','#529999','#212322','#B7B7B7'];
  const ps=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.45, vx:(Math.random()-.5)*11, vy:-Math.random()*12-4, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ const dt=t-t0; x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha=Math.max(0,1-dt/1800); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(dt<1800) requestAnimationFrame(f); else c.remove(); })(t0);
}

async function simSend(){
  const inp=$('simIn'); const txt=inp.value.trim(); if(!txt||SIM.busy) return;
  const s=SIM.s; SIM.turns.push({role:'user',content:txt}); SIM.busy=true; SIM.live=''; SIM.err=''; renderSim();
  const rules = `${s.persona}\n\nEstás en una conversación por WhatsApp con un asesor inmobiliario en México. Tu primer mensaje fue: "${s.opener}". Responde SOLO como este personaje, en español de México, natural y breve (máximo 60 palabras). No des consejos al asesor ni salgas del personaje. Si el asesor te escucha, pregunta y usa datos, cede poco a poco; si te presiona o no te escucha, resístete más. Sin emojis.`;
  simCtl=new AbortController();
  try{
    const turns=SIM.turns.slice(-16); if(turns[0].role!=='user') turns.shift();
    const {text}=await sample([{role:'user',content:rules},...turns],{cache:false,modelTier:'quick',signal:simCtl.signal,onText:({text})=>{ SIM.live=text; const l=$('simLive'); if(l) l.textContent=text; }});
    if(!SIM) return;
    SIM.turns.push({role:'assistant',content:text});
  }catch(e){
    if(!SIM) return;
    if(e&&e.text){ SIM.turns.push({role:'assistant',content:e.text}); } else { SIM.turns.pop(); SIM.err=aiErr(e)||''; }
  }
  SIM.busy=false; renderSim();
}
async function simGrade(){
  const s=SIM.s; SIM.grading=true; renderSim();
  const transcript = `CLIENTE: ${s.opener}\n` + SIM.turns.map(t=>(t.role==='user'?'ASESOR: ':'CLIENTE: ')+t.content).join('\n');
  try{
    const r = await sample.json(`Evalúa a un asesor inmobiliario en México en un juego de rol de negociación por WhatsApp.\nEscenario: ${s.setup}\nObjetivo del asesor: ${s.goal}\n\nTranscripción:\n${transcript}\n\nCalifica de 0 a 100 cómo manejó la conversación: escucha, preguntas, uso de datos, manejo de la objeción, propuesta de siguiente paso y tono profesional. Sé justo y exigente. Responde solo con JSON en español de México con esta forma: {"score": 0-100, "logro": true|false, "fortalezas": ["frase corta", "frase corta"], "mejorar": ["consejo concreto", "consejo concreto"], "frase_modelo": "una frase que el asesor pudo haber dicho"}`,{cache:false});
    if(!SIM) return;
    const score=Math.max(0,Math.min(100,Math.round(Number(r.score)||0)));
    r.score=score; r.fortalezas=[].concat(r.fortalezas||[]).map(String).slice(0,3); r.mejorar=[].concat(r.mejorar||[]).map(String).slice(0,3); r.frase_modelo=r.frase_modelo?String(r.frase_modelo):'';
    SIM.gain = 10 + Math.round(score/10);
    S.sims = S.sims||{}; S.sims[s.id]=Math.max(S.sims[s.id]||0, score);
    addXp(SIM.gain); persist();
    SIM.result=r; SIM.grading=false; renderSim(); if(score>=70) celebrate();
  }catch(e){ if(!SIM) return; SIM.grading=false; SIM.err=aiErr(e)||'No se pudo calificar. Intenta de nuevo.'; renderSim(); }
}

  const upd = news?.updatedAt ? new Date(news.updatedAt).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}) : '';
  v.innerHTML = `<div class="section-head"><span class="tag">Noticias · ${esc(news?.week||'Esta semana')}</span><h2>Las 5 noticias que un broker debe saber</h2><p class="muted">Seleccionadas y resumidas por el agente de noticias de Pulppo${upd?' · actualizado el '+esc(upd):''}. Cada una trae qué significa para tu trabajo.</p></div>
  ${items.length? `<div class="news">${items.map((n,i)=>`<article class="newsitem"><span class="rank">${i+1}</span><div class="body"><span class="tag">${esc(n.topic||'Mercado')} · ${esc(n.date||'')}</span><h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p><p class="why"><b>Para ti:</b> ${esc(n.why)}</p><div class="actions" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">${n.url?`<a class="linkbtn" href="${esc(n.url)}" target="_blank" rel="noopener">Fuente: ${esc(n.source||'ver nota')}</a>`:''}<button class="linkbtn ai-only" data-explain="${i}" hidden>Redáctalo para mi cliente</button></div><div class="explain-out" id="ex-${i}" hidden></div></div></article>`).join('')}</div>` : `<div class="empty"><h3>Aún no hay noticias esta semana</h3><p class="muted" style="margin-top:6px">El agente publica la edición cada lunes por la mañana.</p></div>`}
  <div class="card chat ai-only" hidden>
    <span class="tag">Asistente Pulppo</span>
    <h3>Pregunta sobre las noticias o la plataforma</h3>
    <div class="msgs" id="msgs" aria-live="polite">${chatTurns.map(t=>`<div class="msg ${t.role==='user'?'me':'bot'}">${esc(t.content)}</div>`).join('')}</div>
    <div class="chips" id="chips">${['¿Cómo afecta la tasa de Banxico a mis clientes?','¿Qué le digo a un cliente con Infonavit?','¿Cómo subo mi primera propiedad?'].map(c=>`<button class="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <form class="composer" id="chatForm"><input id="chatIn" placeholder="Escribe tu pregunta" autocomplete="off" aria-label="Tu pregunta"><button class="btn" id="chatSend">Enviar</button></form>
    <span class="cap">Las respuestas usan tu cuenta de Claude. Verifica cifras antes de enviarlas a un cliente.</span>
  </div>`;
  const aiOn = !!sample;
  v.querySelectorAll('.ai-only').forEach(e=>e.hidden=!aiOn);
  if(!aiOn) return;
  v.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>explain(+b.dataset.explain,b));
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ $('chatIn').value=b.dataset.q; ask(); });
  $('chatForm').onsubmit=e=>{ e.preventDefault(); ask(); };
  const m=$('msgs'); m.scrollTop=m.scrollHeight;
}
function aiErr(e){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){ sample=null; renderNews(); return 'El asistente no está disponible en esta vista.'; }
  if(c==='rate_limited') return 'Demasiadas preguntas seguidas. Intenta en unos minutos.';
  if(c==='session_expired') return 'Tu sesión expiró. Vuelve a iniciar sesión en Claude.';
  if(c==='cancelled') return '';
  return 'No se pudo obtener respuesta. Intenta de nuevo.';
}
async function explain(i,btn){
  const n=news.items[i]; const out=$('ex-'+i);
  out.hidden=false; out.textContent='Pensando…'; btn.disabled=true;
  try{
    const {text}=await sample(`Eres asesor inmobiliario en México. Redacta un mensaje de WhatsApp breve (máximo 90 palabras), cordial y en español de México, para compartir con un cliente comprador o propietario esta noticia y por qué le conviene saberla. No inventes cifras: usa solo las de la noticia. Sin emojis. Sin saludo con nombre (usa "Hola").\n\nNoticia: ${n.title}. ${n.summary}\nContexto para el asesor: ${n.why}`,{modelTier:'quick',cache:{gcTime:86400000},onText:({text})=>{out.textContent=text;}});
    out.textContent=text;
  }catch(e){ out.textContent=(e&&e.text)||aiErr(e); }
  btn.disabled=false;
}
async function ask(){
  const inp=$('chatIn'); const q=inp.value.trim(); if(!q||!sample) return;
  inp.value=''; chatTurns.push({role:'user',content:q}); if(chatTurns.length>12) chatTurns=chatTurns.slice(-12);
  if(chatTurns[0].role!=='user') chatTurns.shift();
  renderNews();
  const m=$('msgs'); const bubble=document.createElement('div'); bubble.className='msg bot'; bubble.textContent='Pensando…'; m.appendChild(bubble); m.scrollTop=m.scrollHeight;
  $('chatSend').disabled=true;
  chatCtl=new AbortController();
  const rules = `Eres el Asistente Pulppo, que ayuda a asesores inmobiliarios en México que están empezando en la plataforma Pulppo. Responde en español de México, en 120 palabras o menos, directo y práctico. Usa solo la información de abajo y conocimiento general del mercado inmobiliario mexicano. Si no sabes algo específico de la plataforma, dilo y sugiere preguntar al canal de ayuda o a su KAM. No inventes cifras. Sin emojis. Usa "asesores" o "brokers", nunca "agentes".\n\nNOTICIAS DE LA SEMANA:\n${newsContext()}\n\nCONOCIMIENTO DE LA PLATAFORMA:\n${PULPPO_FACTS}`;
  try{
    const {text}=await sample([{role:'user',content:rules},...chatTurns],{cache:false,signal:chatCtl.signal,onText:({text})=>{bubble.textContent=text; m.scrollTop=m.scrollHeight;}});
    chatTurns.push({role:'assistant',content:text});
  }catch(e){
    const keep=e&&e.text; const msg=aiErr(e);
    if(keep){ bubble.textContent=keep; chatTurns.push({role:'assistant',content:keep}); } else bubble.textContent=msg||'Detenido.';
  }
  if($('chatSend')) $('chatSend').disabled=false;
}

/* =========================== RANKING / PANEL LÍDER =========================== */
let profs={};
async function renderTeam(){
  const v=$('view-team');
  if(!db){ v.innerHTML=`<div class="section-head"><span class="tag">Ranking</span><h2>Ranking del equipo</h2></div><div class="empty"><p>El ranking y el panel del líder se activan cuando abres la página desde claude.ai con tu cuenta del equipo.</p></div>`; return; }
  const rows = team.map(d=>({id:d.id, ...d.data()})).filter(r=>r && typeof r.xp==='number');
  const ids = rows.map(r=>r.id);
  if(userNs && ids.length){ try{ profs = await userNs.profiles(ids); }catch(e){} }
  const nameOf = id => (profs[id]&&profs[id].name) || (id===uid?'Tú':'Asesor');
  const avatarOf = id => profs[id]?.avatarUrl || '';
  const byXp=[...rows].sort((a,b)=>b.xp-a.xp);
  let html = `<div class="section-head"><span class="tag">Ranking · ${rows.length} asesores</span><h2>Ranking del equipo</h2><p class="muted">Ordenado por XP total. Suma XP con lecciones, primeros pasos y tareas.</p></div>`;
  html += byXp.length ? `<div class="rank-list">${byXp.slice(0,15).map((r,i)=>`<div class="rank-row ${r.id===uid?'me':''}"><span class="pos">${i+1}</span><span class="who">${avatarOf(r.id)?`<img src="${esc(avatarOf(r.id))}" alt="">`:''}<span><b class="nm" data-id="${esc(r.id)}"></b>${r.inmo?` <span class="cap">· ${esc(r.inmo)}</span>`:''}</span></span><span class="xp" style="font-size:14px">${r.xp.toLocaleString('es-MX')} XP</span></div>`).join('')}</div>` : `<div class="empty"><p>Nadie ha sumado XP todavía. Completa tu primera lección y aparece aquí.</p></div>`;

  html += `<div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="tag">Tu inmobiliaria</span><div class="field composer"><input id="inmoIn" placeholder="Ej. Inmobiliaria Norte" value="${esc(S.inmo)}" aria-label="Tu inmobiliaria"><button class="btn small" id="inmoSave">Guardar</button></div><span class="cap">Ayuda a tu líder a identificarte en el panel.</span></div>`;

  if(isOwner){
    const n=rows.length||1;
    const guideAvg = Math.round(rows.reduce((s,r)=>s+GUIDE.filter(g=>r.guide?.[g.id]).length/GUIDE.length,0)/n*100);
    const lessonsTot = rows.reduce((s,r)=>s+Object.keys(r.lessons||{}).length,0);
    const active7 = rows.filter(r=>r.updatedAt && Date.now()-r.updatedAt < 7*864e5).length;
    const stuck = rows.filter(r=>!r.updatedAt || Date.now()-r.updatedAt >= 7*864e5).length;
    html += `<div class="section-head" style="margin-top:16px"><span class="tag">Panel del líder · solo tú lo ves</span><h2>Seguimiento de onboarding</h2><p class="muted">Avance de cada asesor en lecciones, primeros pasos y tareas. Se actualiza en vivo.</p></div>
    <div class="statrow"><div class="s"><span class="n">${active7}</span><span class="cap">activos en 7 días</span></div><div class="s"><span class="n">${guideAvg}%</span><span class="cap">primeros pasos, promedio</span></div><div class="s"><span class="n">${lessonsTot}</span><span class="cap">lecciones completadas</span></div><div class="s"><span class="n" style="color:${stuck?'var(--err)':'inherit'}">${stuck}</span><span class="cap">sin actividad en 7 días</span></div></div>
    <div class="table-wrap"><table><thead><tr><th>Asesor</th><th>Inmobiliaria</th><th class="num">XP</th><th>Lecciones</th><th>Primeros pasos</th><th>Onboarding</th><th>Semana</th><th>Academia</th><th class="num">Racha</th><th>Última actividad</th></tr></thead><tbody>
    ${[...rows].sort((a,b)=>pathPct(a)-pathPct(b)).map(r=>{
      const l=UNITS.filter(u=>r.lessons?.[u.id]).length, g=GUIDE.filter(x=>r.guide?.[x.id]).length, t=TASKS_ONCE.filter(x=>r.tasks?.[x.id]).length, w=TASKS_WEEK.filter(x=>r.weekly?.[WEEK]?.[x.id]).length;
      const days = r.updatedAt ? Math.floor((Date.now()-r.updatedAt)/864e5) : null;
      const last = days===null?'—': days===0?'Hoy': days===1?'Ayer': `Hace ${days} días`;
      const mb=(a,b)=>`<div class="minibar"><div class="bar ok"><i style="width:${a/b*100}%"></i></div><span>${a}/${b}</span></div>`;
      return `<tr><td><span class="who">${avatarOf(r.id)?`<img src="${esc(avatarOf(r.id))}" alt="">`:''}<b class="nm" data-id="${esc(r.id)}"></b></span></td><td>${esc(r.inmo||'—')}</td><td class="num">${r.xp}</td><td>${mb(l,UNITS.length)}</td><td>${mb(g,GUIDE.length)}</td><td>${mb(t,TASKS_ONCE.length)}</td><td>${mb(w,TASKS_WEEK.length)}</td><td>${mb(ACADEMY.filter(u=>r.academy?.[u.id]).length,ACADEMY.length)}</td><td class="num">${streakNow(r)}</td><td>${days!==null&&days>=7?`<span class="pill err">${last}</span>`:last}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  }
  v.innerHTML = html;
  v.querySelectorAll('.nm').forEach(el=>el.textContent=nameOf(el.dataset.id));
  $('inmoSave').onclick=()=>{ S.inmo=$('inmoIn').value.trim().slice(0,80); persist(); toast('Guardado'); };
}

/* =========================== NAV / RENDER =========================== */
let current='learn';
function show(view){
  current=view;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.view===view)));
  document.querySelectorAll('.view').forEach(s=>s.hidden = s.id!=='view-'+view);
  try{ localStorage.setItem(LS_KEY+'-tab', view); }catch(e){}
  renderView();
}
function renderView(){
  ({learn:renderLearn, guide:renderGuide, tasks:renderTasks, news:renderNews, team:renderTeam})[current]();
}
function renderAll(){ renderHud(); if(!L) renderView(); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.view));

/* =========================== ARRANQUE =========================== */
loadLocal();
try{ const t=localStorage.getItem(LS_KEY+'-tab'); if(t && $('view-'+t)) current=t; }catch(e){}
show(current); renderHud();

(async function boot(){
  if(!window.claude || !claude.use) return;
  const [dbNs, uNs, sNs] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]);
  sample = sNs; userNs = uNs;
  if(uNs){
    uid = await uNs.id(); isOwner = await uNs.isOwner();
    const me = await uNs.me(); if(me.name) $('greet').textContent = `Hola, ${me.name.split(' ')[0]}. Aprende la plataforma y el oficio en lecciones de 3 minutos.`;
    $('tab-team').firstChild.textContent = isOwner ? 'Equipo ' : 'Ranking ';
    if(isOwner && current==='learn') renderLearn();
  }
  if(current==='news') renderNews();
  if(!dbNs) { renderAll(); return; }
  db = dbNs;
  db.doc('news/current').onSnapshot(s=>{ news = s.exists ? s.data() : null; if(current==='news') renderNews(); }, ()=>{});
  if(uid){
    try{
      const snap = await db.doc('progress/'+uid).get();
      if(snap.exists){
        const remote = Object.assign(fresh(), snap.data());
        // conserva lo más reciente entre navegador y nube
        if((S.updatedAt||0) > (remote.updatedAt||0)) { loadedRemote=true; persist(); }
        else { S = remote; saveLocal(); loadedRemote=true; }
      } else { loadedRemote=true; if(S.xp>0 || Object.keys(S.guide).length) persist(); }
      setSync('Progreso sincronizado con tu equipo.');
    }catch(e){ setSync('Sin conexión al equipo; tu progreso se guarda en este navegador.'); }
  }
  db.collection('progress').onSnapshot(s=>{ team = s.docs.filter(d=>d.exists); if(current==='team') renderTeam(); }, ()=>{});
  renderAll();
})();
</script>
